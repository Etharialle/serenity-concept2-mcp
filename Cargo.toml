[package]
name = "serenity-concept2-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "Read-only Model Context Protocol server for the Concept2 Logbook"
license = "MIT"
repository = "https://github.com/Etharialle/serenity-concept2-mcp"
readme = "README.md"
keywords = ["mcp", "concept2", "rowing", "logbook"]
categories = ["command-line-utilities", "web-programming::http-client"]
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "docs/*.md", "CHANGELOG.md"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
httpdate = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "stream"] }
rmcp = { version = "3.5.0", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "net", "process", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
jsonschema = { version = "0.58.2", default-features = false }
rmcp = { version = "3.5.0", default-features = false, features = ["client", "transport-child-process"] }

[profile.release]
lto = "thin"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
